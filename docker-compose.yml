services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ./src/.env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - media-data:/app/media 
    environment:
      - PYTHONPATH=/app/src
      - TF_XLA_FLAGS=--tf_xla_enable_xla_devices=false
      - TF_CPP_MIN_LOG_LEVEL=2
      - CUDA_VISIBLE_DEVICES=-1
    mem_limit: 512m

  db:
    image: postgres:13
    env_file:
      - ./src/.env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    expose:
      - "5432"
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  # pgadmin:
  #   image: dpage/pgadmin4:latest
  #   env_file:
  #     - ./src/.env
  #   ports:
  #     - "5050:80"
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #   volumes:
  #     - pgadmin-data:/var/lib/pgadmin
  #   mem_limit: 256m

  create_superuser:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ./src/.env
    depends_on:
      db:
        condition: service_healthy
    command: python -m src.scripts.create_first_superuser
    volumes:
      - ./src:/app/src
    environment:
      - PYTHONPATH=/app/src
    profiles:
      - tools

volumes:
  postgres-data:
  # pgadmin-data:
  media-data: